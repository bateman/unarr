# Follow the Sonarr and Radarr releases, up to the draft PR (issue #9;
# upstream/README.md, "The workflow: up to the draft PR").
#
# Every Monday, and on request, per personality, one chain of jobs:
#
#   plan-<app>      the target release and the jump; nothing when no release
#                   is new or a port is already open; the tarball fetched
#                   (read-only token)
#   announce-<app>  a new major on the schedule: the issue, and nothing else
#   record-<app>    the new original records, in a job with no token, no
#                   secret, no network but the loopback, as a user of its own
#   test-<app>      the bump applied and the tests run, which run the new
#                   tarball's ffprobe: no token, a user of its own, no network
#   publish-<app>   the bump applied, the summary, the branch pushed, and with
#                   UPSTREAM_TOKEN the draft PR opened with its label (write
#                   token; nothing of the new tarball runs there)
#   loop-<app>      on the draft PR this run opened, and only on it: the
#                   port's agent and the checks with the original, in rounds
#                   (upstream-loop.yml); it ends green, saying what is
#                   missing, without ANTHROPIC_API_KEY or main's ruleset
#
# What decides is in scripts/upstream-workflow.py, through Make. The two
# chains are the same steps (YAML anchors): an error in one does not stop
# the other. Upstream text is data: no expression of it reaches a `run:`.
name: upstream

on:
  schedule:
    # Monday morning (issue #9: weekly, a burst of weekend tags in one PR).
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      app:
        description: The personality
        type: choice
        options: [radarr, sonarr]
        required: true
      target:
        description: "The release to go to, X.Y.Z.BUILD (empty: the rule of issue #9)"
        type: string
        required: false

permissions: {}

jobs:
  plan-radarr:
    name: plan (radarr)
    if: github.event_name == 'schedule' || inputs.app == 'radarr'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: read }
    env: { APP: radarr }
    outputs:
      action: ${{ steps.plan.outputs.action }}
      target: ${{ steps.plan.outputs.target }}
      jump: ${{ steps.plan.outputs.jump }}
      pr: ${{ steps.plan.outputs.pr }}
    steps: &plan-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The release flags from the API with the job's token (issue #9); the
      # open pull requests and the upstream branches of this repository.
      - name: The target, the jump, and whether there is anything to do
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make upstream-plan-"$APP"
      # Downloaded and checked (host, entries, SHA-256, the API's digest),
      # never run here.
      - name: The tarball of the target, fetched
        if: steps.plan.outputs.action == 'bump'
        env:
          PLAN_TARGET: ${{ steps.plan.outputs.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make bump-"$APP" STEPS=fetch TARGET="$PLAN_TARGET"
          cp -a ".cache/bump/$APP" ".cache/upstream-workflow/$APP/fetched"
          git archive --format=tar.gz -o ".cache/upstream-workflow/$APP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plan-${{ env.APP }}
          path: |
            .cache/upstream-workflow/${{ env.APP }}/plan.json
            .cache/upstream-workflow/${{ env.APP }}/triage.md
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.action == 'bump'
        with:
          name: fetched-${{ env.APP }}
          path: .cache/upstream-workflow/${{ env.APP }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  announce-radarr:
    name: announce a major (radarr)
    needs: plan-radarr
    if: needs.plan-radarr.outputs.action == 'announce'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { issues: write }
    concurrency: { group: upstream-announce-radarr, cancel-in-progress: false }
    env: { APP: radarr }
    steps: &announce-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ env.APP }}
          path: .cache/upstream-workflow/${{ env.APP }}
      - name: The issue of the new major, unless it is open
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make upstream-announce-"$APP"

  # The only job that runs the new original, a binary nobody vetted: no
  # token (no checkout: the tree comes from the planning job), no secret,
  # no cache. The runner's own user has sudo and the docker socket, so it
  # could read the runner's token for caches and artifacts, whatever
  # `permissions:` says: the original runs as a user of its own, outside
  # those groups, that cannot become root again, with no network but the
  # loopback (scripts/run-unprivileged.sh). What it hands on is untrusted.
  record-radarr:
    name: record (radarr)
    needs: plan-radarr
    if: needs.plan-radarr.outputs.action == 'bump'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    env: { APP: radarr }
    steps: &record-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-${{ env.APP }}
          path: ${{ runner.temp }}/fetched
      # The FreeSpace rule of the goldens wants room on / (as in ci.yml);
      # /movies, /tv and /downloads with the fixture scripts' marker.
      # Everything that needs root comes first.
      - name: The tree, a user of its own, and its folders
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo useradd --system --create-home --user-group --shell /usr/sbin/nologin unarr-recorder
          sudo mkdir -p /srv/unarr/.cache/bump
          sudo tar -xzf "$RUNNER_TEMP/fetched/source.tar.gz" -C /srv/unarr
          sudo cp -a "$RUNNER_TEMP/fetched/fetched" "/srv/unarr/.cache/bump/$APP"
          for d in /movies /tv /downloads; do sudo mkdir -p "$d"; sudo touch "$d/.unarr-fixture"; done
          sudo chown -R unarr-recorder: /srv/unarr /movies /tv /downloads
      - name: The new original records, with no network
        working-directory: /srv/unarr
        run: sudo scripts/run-unprivileged.sh unarr-recorder make bump-"$APP" STEPS=record
      - name: The work directory, without the original
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/recorded"
          if [ -d "/srv/unarr/.cache/bump/$APP" ]; then
            sudo cp -a "/srv/unarr/.cache/bump/$APP/." "$RUNNER_TEMP/recorded/"
            sudo rm -rf "$RUNNER_TEMP/recorded/original"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/recorded"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recorded-${{ env.APP }}
          path: ${{ runner.temp }}/recorded
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The tests run the ffprobe of the new tarball (the contract tests use
  # the one the original ships): a binary nobody vetted, so a job like the
  # recording's, with no token and a user of its own. `apply` and the
  # preparation run as the runner's user and run nothing of the tarball;
  # the toolchain is installed by the runner's user and copied over, the
  # crates fetched by the test user with the network, the tests run
  # without it. What it hands on (tests.json) is untrusted.
  test-radarr:
    name: test (radarr)
    needs: [plan-radarr, record-radarr]
    if: needs.record-radarr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {}
    env: { APP: radarr, OTHER: sonarr }
    steps: &test-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-${{ env.APP }}
          path: ${{ runner.temp }}/fetched
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recorded-${{ env.APP }}
          path: ${{ runner.temp }}/recorded
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: stable }
      # As the runner's user: the tree, the bump applied (it downloads and
      # checks the tarball, extracts it, runs nothing of it), the other
      # personality's web UI. Then everything goes to the test user.
      - name: The tree with the bump applied, for a user of its own
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo useradd --system --create-home --user-group --shell /usr/sbin/nologin unarr-tester
          sudo install -d -o "$(id -u)" -g "$(id -g)" /srv/unarr-test
          cd /srv/unarr-test
          tar -xzf "$RUNNER_TEMP/fetched/source.tar.gz"
          # `apply` compares with HEAD, the pins' test lists the tracked
          # files: the planning job's tree as a local commit, never pushed.
          git init -q && git add -A
          git -c user.name=upstream -c user.email=upstream@localhost commit -q -m "The planning job's tree"
          mkdir -p ".cache/upstream-workflow/$APP"
          cp -a "$RUNNER_TEMP/fetched/fetched" ".cache/upstream-workflow/$APP/fetched"
          cp -a "$RUNNER_TEMP/recorded" ".cache/upstream-workflow/$APP/recorded"
          make upstream-assemble-"$APP"
          make ui-"$OTHER"
          make bump-"$APP" STEPS=apply
          sudo cp -a "$HOME/.rustup" "$HOME/.cargo" /home/unarr-tester/
          sudo chown -R unarr-tester: /srv/unarr-test /home/unarr-tester
      - name: The crates, fetched by the test user
        working-directory: /srv/unarr-test
        run: sudo scripts/run-unprivileged.sh --network unarr-tester sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo fetch --locked'
      - name: The tests, as a user of its own, with no network
        working-directory: /srv/unarr-test
        run: sudo scripts/run-unprivileged.sh unarr-tester sh -c 'PATH="$HOME/.cargo/bin:$PATH" CARGO_NET_OFFLINE=true exec make bump-"$1" STEPS=test' sh "$APP"
      - name: The results, handed on
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tested"
          work="/srv/unarr-test/.cache/bump/$APP"
          for f in tests.json logs/cargo-test.log logs/test-scripts.log logs/rerun.log; do
            if sudo test -f "$work/$f" && ! sudo test -L "$work/$f"; then sudo cp "$work/$f" "$RUNNER_TEMP/tested/"; fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/tested"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tested-${{ env.APP }}
          path: ${{ runner.temp }}/tested
          if-no-files-found: warn
          retention-days: 7

  # The job that writes. Nothing of the new tarball runs here: `apply`
  # reads the recording as untrusted, downloads the tarball again to check
  # it against the checksum the planning job fetched, and the extracted
  # original is removed at once (make upstream-apply-<app>); the tests'
  # results come from test-<app>, checked before the summary quotes them.
  # The job's token pushes; the PR is opened only with UPSTREAM_TOKEN.
  publish-radarr:
    name: bump and draft PR (radarr)
    needs: [plan-radarr, record-radarr, test-radarr]
    if: needs.test-radarr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write, pull-requests: read }
    concurrency: { group: upstream-publish-radarr, cancel-in-progress: false }
    env: { APP: radarr }
    # What loop-<app> hooks on: `opened` is true only for the draft PR this
    # run opened (not a port found open since the plan, not a branch pushed
    # without UPSTREAM_TOKEN).
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ steps.pr.outputs.branch }}
      app: ${{ steps.pr.outputs.app }}
      target: ${{ steps.pr.outputs.target }}
      jump: ${{ steps.pr.outputs.jump }}
      url: ${{ steps.pr.outputs.url }}
      opened: ${{ steps.pr.outputs.opened }}
    steps: &publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched-${{ env.APP }}
          path: .cache/upstream-workflow/${{ env.APP }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recorded-${{ env.APP }}
          path: .cache/upstream-workflow/${{ env.APP }}/recorded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-${{ env.APP }}
          path: .cache/upstream-workflow/${{ env.APP }}/tested
      - name: The work directory, the fetched files over the recorded ones, the tests checked
        run: make upstream-assemble-"$APP"
      - name: The bump applied and summed up
        run: |
          make upstream-apply-"$APP"
          make bump-"$APP" STEPS=summary
      - name: The branch, and the draft PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Opens the PR, so that CI starts on it; without it the branch is
          # pushed and the job says how to open the PR (upstream/README.md).
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: make upstream-pr-"$APP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bump-${{ env.APP }}
          path: .cache/bump/${{ env.APP }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # The agent and the checks on the PR publish-radarr opened. A major gets here
  # only from a start by hand (on the schedule it is announced): that start
  # is the one issue #9 asks for, so the agent goes on by itself. The token's
  # permissions are the most the called jobs may ask for; the key goes by
  # name to the workflow that checks it is set and hands it to the agent's
  # job alone.
  loop-radarr:
    name: the port's agent and the checks (radarr)
    needs: publish-radarr
    if: needs.publish-radarr.outputs.opened == 'true'
    permissions: { contents: write, pull-requests: write, issues: write }
    uses: ./.github/workflows/upstream-loop.yml
    with:
      pr: ${{ fromJSON(needs.publish-radarr.outputs.pr) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  plan-sonarr:
    name: plan (sonarr)
    if: github.event_name == 'schedule' || inputs.app == 'sonarr'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: read }
    env: { APP: sonarr }
    outputs:
      action: ${{ steps.plan.outputs.action }}
      target: ${{ steps.plan.outputs.target }}
      jump: ${{ steps.plan.outputs.jump }}
      pr: ${{ steps.plan.outputs.pr }}
    steps: *plan-steps

  announce-sonarr:
    name: announce a major (sonarr)
    needs: plan-sonarr
    if: needs.plan-sonarr.outputs.action == 'announce'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { issues: write }
    concurrency: { group: upstream-announce-sonarr, cancel-in-progress: false }
    env: { APP: sonarr }
    steps: *announce-steps

  record-sonarr:
    name: record (sonarr)
    needs: plan-sonarr
    if: needs.plan-sonarr.outputs.action == 'bump'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    env: { APP: sonarr }
    steps: *record-steps

  test-sonarr:
    name: test (sonarr)
    needs: [plan-sonarr, record-sonarr]
    if: needs.record-sonarr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: {}
    env: { APP: sonarr, OTHER: radarr }
    steps: *test-steps

  publish-sonarr:
    name: bump and draft PR (sonarr)
    needs: [plan-sonarr, record-sonarr, test-sonarr]
    if: needs.test-sonarr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write, pull-requests: read }
    concurrency: { group: upstream-publish-sonarr, cancel-in-progress: false }
    env: { APP: sonarr }
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ steps.pr.outputs.branch }}
      app: ${{ steps.pr.outputs.app }}
      target: ${{ steps.pr.outputs.target }}
      jump: ${{ steps.pr.outputs.jump }}
      url: ${{ steps.pr.outputs.url }}
      opened: ${{ steps.pr.outputs.opened }}
    steps: *publish-steps

  loop-sonarr:
    name: the port's agent and the checks (sonarr)
    needs: publish-sonarr
    if: needs.publish-sonarr.outputs.opened == 'true'
    permissions: { contents: write, pull-requests: write, issues: write }
    uses: ./.github/workflows/upstream-loop.yml
    with:
      pr: ${{ fromJSON(needs.publish-sonarr.outputs.pr) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
