# cargo-deny: what the dependencies may be, checked in CI (`make deny`).
# Unarr is GPL-3.0-or-later; every licence below can be combined with it.

[graph]
all-features = true

[advisories]
# Any advisory in the RustSec database fails the check, unmaintained
# crates and yanked versions included; an exception goes in `ignore` with
# its reason.
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (an announcement, not a vulnerability), and has
    # no successor version. 153 files use it, for every date the API and the
    # database carry; moving to jiff or time is its own piece of work, and
    # this entry goes when it is done.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no fixed version, replacing it is a separate change" },
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: the Mozilla root certificates, as data.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are allowed (the ecosystem has many); a
# wildcard version requirement is not.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
