# The last upstream Radarr commit Unarr has handled (issue #9).
# scripts/upstream-triage.py reads it; the PR that ports up to a release moves
# it forward, so it advances only when that PR merges. `release` is the
# release `commit` belongs to. It is the cursor, not a copy of the pin
# (upstream/radarr.pin): on a port branch still under way the pin moves
# first, and make check fails until the cursor reaches it, so a port is
# not finished (nor green) before it does.
