[package]
name = "unarrd"
description = "Unarr daemon: one *arr, written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "unarrd"
path = "src/main.rs"

[features]
# A build that panics where a test asks it to, for `make panic-test`.
# Never part of a published binary: `make build` and the image build
# without it.
panic-switch = ["unarr-api/panic-switch", "unarr-core/panic-switch"]

[[test]]
name = "panic"
required-features = ["panic-switch"]

[dependencies]
unarr-core.workspace = true
unarr-api.workspace = true
unarr-import.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
serde_json.workspace = true
