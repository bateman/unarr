[package]
name = "unarr-api"
description = "HTTP surface: Sonarr/Radarr/Lidarr-compatible REST endpoints and a minimal SignalR feed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Routes that panic on purpose (`routes::panic_switch`). For
# `make panic-test`; never part of a published binary.
panic-switch = ["unarr-core/panic-switch"]

[dependencies]
fancy-regex.workspace = true
unarr-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["query", "json", "tokio", "http1", "ws", "form", "multipart"] }
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rusqlite.workspace = true
libc = "0.2"
rust-embed = { version = "8", features = ["include-exclude"] }
sha2 = "0.11"
md-5 = "0.11"
unicode-normalization = "0.1"
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
unarr-import.workspace = true
unarr-mock.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
