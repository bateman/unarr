[package]
name = "unarr-core"
description = "Domain model shared by every *arr personality: media, quality, indexers, download clients, history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Places that panic when a test arms them (`panics::switch`). For
# `make panic-test`; never part of a published binary.
panic-switch = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
chrono.workspace = true
fancy-regex.workspace = true
roxmltree.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "json", "gzip", "multipart", "form", "query", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
unicode-normalization = "0.1"
libc = "0.2"
ring = "0.17"
base64 = "0.22"
# Backups, in the originals' zip layout.
# zip's own `deflate` feature drags in zopfli and zlib-rs; flate2 on miniz
# is enough. Version 9: 2.x has advisories (RUSTSEC-2026-0367 and others) on
# `extract()`, which Unarr never calls; the upgrade spares an ignore for each.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Cover thumbnails, as the originals' ImageSharp resizes them: JPEG and PNG only.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
axum = { workspace = true, features = ["query", "tokio", "http1"] }
