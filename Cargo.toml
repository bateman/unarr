[workspace]
resolver = "2"
members = [
    "crates/unarr-core",
    "crates/unarr-import",
    "crates/unarr-api",
    "crates/unarrd",
    "crates/unarr-mock",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/bateman/unarr"
# The highest of the dependencies' own floors (rusqlite 0.41 today): check
# it again when a dependency moves, with `cargo metadata`.
rust-version = "1.89"
# Unarr ships as an image and as binaries, never on crates.io; this also
# lets `cargo deny` accept the path dependencies between the crates.
publish = false

[workspace.dependencies]
unarr-core = { path = "crates/unarr-core" }
unarr-import = { path = "crates/unarr-import" }
unarr-api = { path = "crates/unarr-api" }
unarr-mock = { path = "crates/unarr-mock" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
roxmltree = "0.21"
fancy-regex = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Small, fast, lean: the non-functional requirements live here too.
# A panic unwinds: one process holds every personality, and a bug in one
# costs the request or the command it happened in, not the others
# (`unarr_core::panics`). `abort` made a smaller binary: docs/DESIGN.md,
# section 9, has the measure.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

# Cover thumbnails are pixel loops: unoptimised, a refresh of the fixture
# spends minutes resizing in the tests. The image stack is built optimised
# in every profile.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
